<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>El Mundo Mágico de Paola</title>
  
  <!-- Tailwind CSS para Estilos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* Prevenir selección de texto y scroll indeseado en móviles */
    html, body {
      height: 100%;
      height: 100dvh; /* Adaptación a navegadores móviles con barra dinámica */
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      overscroll-behavior-y: contain;
    }
    
    .canvas-container {
      touch-action: none;
    }

    /* Animaciones suaves */
    .bounce-active:active {
      transform: scale(0.92);
    }

    /* Pestaña activa */
    .tab-active {
      border-top: 4px solid #ec4899;
      background-color: #fdf2f8;
      color: #be185d;
    }
    
    /* Ocultar barra de scroll estética */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Animación especial del Robot */
    @keyframes pulse-shake {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.3) rotate(-15deg); }
      75% { transform: scale(1.3) rotate(15deg); }
    }
    .robot-super {
      animation: pulse-shake 0.4s infinite;
    }
  </style>
</head>
<body class="bg-slate-100 font-sans w-screen flex flex-col overflow-hidden" style="height: 100dvh; min-height: -webkit-fill-available;">

  <!-- ENCABEZADO SUPERIOR / RECOMPENSAS -->
  <header class="bg-gradient-to-r from-pink-500 via-purple-500 to-indigo-500 text-white p-3 flex justify-between items-center shadow-md shrink-0 z-10">
    <div class="flex items-center space-x-2">
      <button onclick="speakText('¡Hola Paola campeona! Elige una actividad abajo para empezar a jugar.')" class="bg-white/20 p-2 rounded-full active:scale-95 transition">
        <span class="text-2xl">👑</span>
      </button>
      <div>
        <h1 class="font-black text-lg leading-none">Mundo Mágico de Paola</h1>
        <p class="text-xs text-pink-100 font-medium">¡Bienvenida Paola! A jugar y crear</p>
      </div>
    </div>

    <!-- Contador de Estrellas -->
    <div class="bg-yellow-400 text-yellow-950 px-3 py-1 rounded-full font-black text-lg flex items-center shadow-inner space-x-1 border-2 border-yellow-200">
      <span>⭐</span>
      <span id="star-count">0</span>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL DE PANTALLAS -->
  <main class="flex-1 relative overflow-hidden bg-slate-50 min-h-0">
    
    <!-- ==================== 1. MÓDULO LIENZO DE DIBUJO ==================== -->
    <section id="tab-art" class="tab-content absolute inset-0 flex flex-col p-2 space-y-2">
      
      <!-- Barra de herramientas superior -->
      <div class="bg-white p-2 rounded-2xl shadow flex items-center justify-between gap-2 overflow-x-auto shrink-0 border border-pink-100 no-scrollbar">
        <!-- Paleta de Colores Ampliada para Paola -->
        <div class="flex items-center space-x-1.5 shrink-0">
          <button onclick="setColor('#ef4444')" class="w-8 h-8 rounded-full bg-red-500 border-2 border-white shadow active:scale-90 shrink-0"></button>
          <button onclick="setColor('#f97316')" class="w-8 h-8 rounded-full bg-orange-500 border-2 border-white shadow active:scale-90 shrink-0"></button>
          <button onclick="setColor('#eab308')" class="w-8 h-8 rounded-full bg-yellow-500 border-2 border-white shadow active:scale-90 shrink-0"></button>
          <button onclick="setColor('#22c55e')" class="w-8 h-8 rounded-full bg-green-500 border-2 border-white shadow active:scale-90 shrink-0"></button>

          <button onclick="setColor('#14b8a6')" class="w-8 h-8 rounded-full bg-teal-500 border-2 border-white shadow active:scale-90 shrink-0"></button>
          <button onclick="setColor('#3b82f6')" class="w-8 h-8 rounded-full bg-blue-500 border-2 border-white shadow active:scale-90 shrink-0"></button>
          <button onclick="setColor('#8b5cf6')" class="w-8 h-8 rounded-full bg-purple-500 border-2 border-white shadow active:scale-90 shrink-0"></button>
          <button onclick="setColor('#ec4899')" class="w-8 h-8 rounded-full bg-pink-500 border-2 border-white shadow active:scale-90 shrink-0"></button>

          <button onclick="setColor('#78350f')" class="w-8 h-8 rounded-full bg-amber-900 border-2 border-white shadow active:scale-90 shrink-0"></button>
          <button onclick="setColor('#0f172a')" class="w-8 h-8 rounded-full bg-slate-900 border-2 border-white shadow active:scale-90 shrink-0"></button>
        </div>

        <div class="h-6 w-px bg-slate-200 shrink-0"></div>

        <!-- Sellos Mágicos (Incluye Corazón para Paola) -->
        <div class="flex items-center space-x-1 overflow-x-auto no-scrollbar shrink-0">
          <button onclick="setStamp('💖')" title="Corazón" class="px-2 py-1 bg-pink-100 text-pink-700 rounded-xl text-xl font-bold shadow-sm active:scale-90 shrink-0">💖</button>
          <button onclick="setStamp('⭐')" title="Estrella" class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-xl text-xl font-bold shadow-sm active:scale-90 shrink-0">⭐</button>
          <button onclick="setStamp('🦄')" title="Unicornio" class="px-2 py-1 bg-purple-100 text-purple-700 rounded-xl text-xl font-bold shadow-sm active:scale-90 shrink-0">🦄</button>
          <button onclick="setStamp('🌸')" title="Flor" class="px-2 py-1 bg-rose-100 text-rose-700 rounded-xl text-xl font-bold shadow-sm active:scale-90 shrink-0">🌸</button>
          <button onclick="setStamp('🦋')" title="Mariposa" class="px-2 py-1 bg-blue-100 text-blue-700 rounded-xl text-xl font-bold shadow-sm active:scale-90 shrink-0">🦋</button>
          <button onclick="setStamp('👑')" title="Corona" class="px-2 py-1 bg-amber-100 text-amber-700 rounded-xl text-xl font-bold shadow-sm active:scale-90 shrink-0">👑</button>
          <button onclick="setStamp('🌈')" title="Arcoíris" class="px-2 py-1 bg-indigo-100 text-indigo-700 rounded-xl text-xl font-bold shadow-sm active:scale-90 shrink-0">🌈</button>
          
          <button onclick="clearCanvas()" title="Borrar" class="p-2 bg-red-100 text-red-600 rounded-xl font-bold text-xs flex items-center space-x-1 active:scale-90 shrink-0">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Área de Dibujo Canvas -->
      <div class="flex-1 bg-white rounded-3xl shadow-inner border-4 border-pink-200 relative overflow-hidden canvas-container min-h-0">
        <canvas id="paintCanvas" class="w-full h-full block cursor-crosshair"></canvas>
      </div>
    </section>

    <!-- ==================== 2. MÓDULO RETOS DE MOVIMIENTO ==================== -->
    <section id="tab-motion" class="tab-content absolute inset-0 hidden flex-col p-4 justify-between items-center text-center overflow-y-auto no-scrollbar">
      
      <div class="w-full bg-gradient-to-br from-amber-400 via-orange-500 to-pink-500 rounded-3xl p-5 text-white shadow-lg border-4 border-orange-200 flex flex-col items-center justify-center space-y-3">
        
        <div class="bg-white/20 p-4 rounded-full text-6xl animate-bounce" id="challenge-icon">
          🤸‍♀️
        </div>

        <h2 class="text-2xl font-black" id="challenge-title">¡Misión de Gimnasta!</h2>
        <p class="text-lg font-bold text-orange-100" id="challenge-desc">¡Haz 5 saltos gigantes de rana en tu lugar Paola!</p>

        <!-- Botones de Acción -->
        <div class="flex flex-wrap justify-center gap-2">
          <button onclick="readCurrentChallenge()" class="bg-white text-orange-600 px-5 py-2.5 rounded-full font-black text-base shadow-md flex items-center space-x-2 active:scale-95">
            <span class="text-xl">🔊</span>
            <span>Escuchar Reto</span>
          </button>
          <button onclick="nextRandomChallenge()" class="bg-amber-900/30 text-white border border-white/40 px-4 py-2.5 rounded-full font-bold text-sm shadow flex items-center space-x-1 active:scale-95">
            <span>🎲 Cambiar Reto</span>
          </button>
        </div>
      </div>

      <!-- Botón de Cumplido / Siguiente -->
      <button onclick="completeChallenge()" class="w-full max-w-xs my-2 bg-emerald-500 text-white font-black text-xl py-4 rounded-2xl shadow-lg border-b-4 border-emerald-700 active:scale-95 flex items-center justify-center space-x-2 shrink-0">
        <span>¡LO HICISTE PAOLA!</span>
        <span class="text-2xl">🎉</span>
      </button>

    </section>

    <!-- ==================== 3. MÓDULO ROBOT LAB ==================== -->
    <section id="tab-robot" class="tab-content absolute inset-0 hidden flex-col p-3 space-y-2">
      
      <!-- Tablero del Robot -->
      <div class="bg-slate-800 rounded-3xl p-4 text-white flex-1 flex flex-col justify-between items-center relative overflow-hidden border-4 border-indigo-300">
        
        <!-- Estado del Robot -->
        <div class="text-center">
          <p class="text-xs text-indigo-300 font-bold uppercase tracking-wider">Laboratorio del Robot de Paola</p>
          <p id="robot-status-text" class="text-sm font-bold text-yellow-400">Toca los botones de abajo para programar</p>
        </div>

        <!-- Avatar del Robot -->
        <div id="robot-avatar" class="text-7xl transition-all duration-300 transform">
          🤖
        </div>

        <!-- Secuencia de Bloques Programados -->
        <div class="w-full bg-slate-900/60 p-2 rounded-xl flex items-center justify-center space-x-1.5 min-h-[52px] border border-slate-700 overflow-x-auto no-scrollbar" id="command-sequence">
          <span class="text-slate-500 text-xs italic">Elige tus movimientos...</span>
        </div>
      </div>

      <!-- Botones de Comandos Físicos -->
      <div class="bg-white p-3 rounded-3xl shadow-md border border-indigo-100 space-y-2 shrink-0">
        <p class="text-xs font-black text-slate-400 uppercase text-center">Controles del Robot</p>

        <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
          <button onclick="addRobotCommand('⬆️', 'Avanzar')" class="bg-indigo-500 text-white p-3 rounded-2xl font-black text-xl shadow active:scale-90 flex flex-col items-center justify-center">
            <span>⬆️</span>
            <span class="text-[10px] uppercase font-bold mt-0.5">Avanzar</span>
          </button>
          <button onclick="addRobotCommand('⬇️', 'Retroceder')" class="bg-blue-500 text-white p-3 rounded-2xl font-black text-xl shadow active:scale-90 flex flex-col items-center justify-center">
            <span>⬇️</span>
            <span class="text-[10px] uppercase font-bold mt-0.5">Atrás</span>
          </button>
          <button onclick="addRobotCommand('🌀', 'Girar')" class="bg-purple-500 text-white p-3 rounded-2xl font-black text-xl shadow active:scale-90 flex flex-col items-center justify-center">
            <span>🌀</span>
            <span class="text-[10px] uppercase font-bold mt-0.5">Girar</span>
          </button>
          <button onclick="addRobotCommand('🤸', 'Saltar')" class="bg-pink-500 text-white p-3 rounded-2xl font-black text-xl shadow active:scale-90 flex flex-col items-center justify-center">
            <span>🤸</span>
            <span class="text-[10px] uppercase font-bold mt-0.5">Saltar</span>
          </button>
          <button onclick="addRobotCommand('💖', 'Amor')" class="bg-rose-500 text-white p-3 rounded-2xl font-black text-xl shadow active:scale-90 flex flex-col items-center justify-center">
            <span>💖</span>
            <span class="text-[10px] uppercase font-bold mt-0.5">Cariño</span>
          </button>
          <button onclick="addRobotCommand('⚡', 'Súper Velocidad')" class="bg-amber-500 text-white p-3 rounded-2xl font-black text-xl shadow active:scale-90 flex flex-col items-center justify-center">
            <span>⚡</span>
            <span class="text-[10px] uppercase font-bold mt-0.5">Súper</span>
          </button>
        </div>

        <!-- Botones de Acción del Robot -->
        <div class="flex space-x-2 pt-1">
          <button onclick="clearRobotCommands()" class="bg-slate-200 text-slate-700 px-4 py-2.5 rounded-xl font-bold text-xs active:scale-90 shrink-0">
            Borrar
          </button>
          <button onclick="runRobotSequence()" class="flex-1 bg-emerald-500 text-white py-2.5 px-4 rounded-xl font-black text-sm shadow active:scale-95 text-center flex items-center justify-center space-x-2">
            <span>¡INICIAR ROBOT!</span>
            <span>🚀</span>
          </button>
        </div>
      </div>

    </section>

  </main>

  <!-- NAVEGACIÓN INFERIOR (TAB BAR FIJA CON SAFE-AREA PARA MÓVILES) -->
  <nav class="bg-white border-t-2 border-pink-200 grid grid-cols-3 shrink-0 shadow-lg z-50 relative" style="padding-bottom: max(0.5rem, env(safe-area-inset-bottom));">
    <button onclick="switchTab('tab-art')" id="btn-tab-art" class="py-2.5 flex flex-col items-center justify-center text-slate-500 tab-active">
      <i data-lucide="palette" class="w-6 h-6 mb-0.5"></i>
      <span class="text-xs font-black">Arte</span>
    </button>

    <button onclick="switchTab('tab-motion')" id="btn-tab-motion" class="py-2.5 flex flex-col items-center justify-center text-slate-500">
      <i data-lucide="activity" class="w-6 h-6 mb-0.5"></i>
      <span class="text-xs font-black">Moverse</span>
    </button>

    <button onclick="switchTab('tab-robot')" id="btn-tab-robot" class="py-2.5 flex flex-col items-center justify-center text-slate-500">
      <i data-lucide="bot" class="w-6 h-6 mb-0.5"></i>
      <span class="text-xs font-black">Robot</span>
    </button>
  </nav>

  <!-- LÓGICA JAVASCRIPT -->
  <script>
    // Inicializar Íconos Lucide
    lucide.createIcons();

    // Estado global de la App
    let stars = 0;
    let currentColor = '#ec4899';
    let currentStamp = null;
    let isDrawing = false;

    // --- SÍNTESIS DE VOZ (LECTORA PERSONALIZADA PARA PAOLA) ---
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel(); // Cancelar anteriores
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 0.9; // Hablar despacio y claro
        utterance.pitch = 1.15; // Tono alegre
        window.speechSynthesis.speak(utterance);
      }
    }

    // --- NAVEGACIÓN ENTRE PESTAÑAS ---
    function switchTab(tabId) {
      // Ocultar todas las secciones
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('tab-active'));

      // Mostrar la seleccionada
      document.getElementById(tabId).classList.remove('hidden');
      document.getElementById('btn-' + tabId).classList.add('tab-active');

      // Acciones específicas por pestaña
      if (tabId === 'tab-art') {
        speakText("¡Lienzo de Arte! Dibuja lo que quieras Paola.");
        resizeCanvas();
      } else if (tabId === 'tab-motion') {
        speakText("¡Retos de movimiento! Prepárate Paola.");
        readCurrentChallenge();
      } else if (tabId === 'tab-robot') {
        speakText("¡Laboratorio de Robot de Paola!");
      }
    }

    // --- LÓGICA DEL CANVA DE DIBUJO ---
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 8;
    }

    function setColor(color) {
      currentColor = color;
      currentStamp = null;
      speakText("Color cambiado");
    }

    function setStamp(stamp) {
      currentStamp = stamp;
      speakText("Sello mágico elegido");
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      speakText("Lienzo limpio Paola");
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      
      if (currentStamp) {
        ctx.font = '42px serif';
        ctx.fillText(currentStamp, pos.x - 20, pos.y + 15);
        isDrawing = false;
        return;
      }

      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
      ctx.strokeStyle = currentColor;
    }

    function draw(e) {
      if (!isDrawing || currentStamp) return;
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    // Eventos Canvas (Touch + Mouse)
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });
    canvas.addEventListener('touchend', stopDrawing);


    // --- LÓGICA DE RETOS DE MOVIMIENTO AMPLIADA ---
    const challenges = [
      { icon: '🤸‍♀️', title: '¡Misión Gimnasta!', desc: '¡Paola, haz 5 saltos gigantes de rana en tu lugar!' },
      { icon: '⚽', title: '¡Pase de Fútbol!', desc: 'Patea 3 pelotas imaginarias súper fuerte con el pie.' },
      { icon: '💃', title: '¡Pausa de Baile!', desc: '¡Baila como una estrella de música por 10 segundos!' },
      { icon: '🦒', title: '¡Reto de Equilibrio!', desc: 'Párate en un solo pie como un flamenco por 5 segundos.' },
      { icon: '⭐', title: '¡Estiramiento Mágico!', desc: 'Toca las puntas de tus pies sin doblar las rodillas.' },
      { icon: '✈️', title: '¡Vuelo de Avión!', desc: 'Abre tus brazos como un avión y gira 3 veces suavemente.' },
      { icon: '👏', title: '¡Aplausos de Victoria!', desc: 'Da 5 aplausos fuertes arriba de tu cabeza.' },
      { icon: '🦁', title: '¡Paso de Gigante!', desc: 'Da 4 pasos gigantescos de león por la habitación.' },
      { icon: '👑', title: '¡Pose de Princesa!', desc: 'Ponte una corona imaginaria y haz una reverencia brillante.' },
      { icon: '🐝', title: '¡Zumbido de Abeja!', desc: 'Corre en tu lugar muy rápido zumbando como una abejita.' }
    ];

    let currentChallengeIndex = 0;

    function readCurrentChallenge() {
      const ch = challenges[currentChallengeIndex];
      speakText(`${ch.title}. ${ch.desc}`);
    }

    function nextRandomChallenge() {
      let nextIndex = Math.floor(Math.random() * challenges.length);
      if (nextIndex === currentChallengeIndex) {
        nextIndex = (currentChallengeIndex + 1) % challenges.length;
      }
      currentChallengeIndex = nextIndex;
      updateChallengeUI();
      readCurrentChallenge();
    }

    function updateChallengeUI() {
      const ch = challenges[currentChallengeIndex];
      document.getElementById('challenge-icon').innerText = ch.icon;
      document.getElementById('challenge-title').innerText = ch.title;
      document.getElementById('challenge-desc').innerText = ch.desc;
    }

    function completeChallenge() {
      stars += 1;
      document.getElementById('star-count').innerText = stars;
      speakText("¡Excelente trabajo Paola! Ganaste una estrella brillante.");
      nextRandomChallenge();
    }

    // --- LÓGICA AMPLIADA DEL ROBOT ---
    let robotCommands = [];

    function addRobotCommand(symbol, name) {
      if (robotCommands.length >= 6) {
        speakText("¡Secuencia llena!");
        return;
      }
      robotCommands.push(symbol);
      updateRobotUI();
      speakText(name);
    }

    function clearRobotCommands() {
      robotCommands = [];
      updateRobotUI();
      speakText("Secuencia borrada");
    }

    function updateRobotUI() {
      const container = document.getElementById('command-sequence');
      if (robotCommands.length === 0) {
        container.innerHTML = '<span class="text-slate-500 text-xs italic">Elige tus movimientos...</span>';
      } else {
        container.innerHTML = robotCommands.map(cmd => `<span class="bg-indigo-600 text-white font-bold p-2 rounded-lg text-base shrink-0">${cmd}</span>`).join('');
      }
    }

    function runRobotSequence() {
      if (robotCommands.length === 0) {
        speakText("Paola, primero elige instrucciones para el robot.");
        return;
      }

      speakText("¡Iniciando rutina del robot de Paola!");
      const avatar = document.getElementById('robot-avatar');
      const statusText = document.getElementById('robot-status-text');
      
      let step = 0;
      const interval = setInterval(() => {
        if (step >= robotCommands.length) {
          clearInterval(interval);
          avatar.className = "text-7xl transition-all duration-300 transform";
          avatar.innerText = "🤖";
          statusText.innerText = "¡Misión Cumplida!";
          stars += 1;
          document.getElementById('star-count').innerText = stars;
          speakText("¡Bravo Paola! El robot completó todos tus comandos.");
          return;
        }

        const cmd = robotCommands[step];
        statusText.innerText = `Ejecutando paso ${step + 1}...`;

        if (cmd === '⬆️') {
          avatar.className = "text-7xl transition-all duration-300 transform -translate-y-8";
          avatar.innerText = "🤖";
        } else if (cmd === '⬇️') {
          avatar.className = "text-7xl transition-all duration-300 transform translate-y-8";
          avatar.innerText = "🤖";
        } else if (cmd === '🌀') {
          avatar.className = "text-7xl transition-all duration-300 transform rotate-180";
          avatar.innerText = "🤖";
        } else if (cmd === '🤸') {
          avatar.className = "text-7xl transition-all duration-300 transform scale-125 -translate-y-4";
          avatar.innerText = "🤸🤖";
        } else if (cmd === '💖') {
          avatar.className = "text-7xl transition-all duration-300 transform scale-110";
          avatar.innerText = "😍🤖";
        } else if (cmd === '⚡') {
          avatar.className = "text-7xl transition-all duration-100 transform robot-super";
          avatar.innerText = "⚡🤖⚡";
        }

        step++;
      }, 750);
    }

    // Inicialización al cargar la ventana
    window.onload = function() {
      switchTab('tab-art');
      window.addEventListener('resize', resizeCanvas);
    };
  </script>
</body>
</html>
